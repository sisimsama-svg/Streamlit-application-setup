<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة التحكم | Muslem Optics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="shell">
    <header class="top">
      <p>Muslem Optics</p>
      <h1>لوحة التحكم</h1>
    </header>
    <form id="login" class="card">
      <label>كلمة السر<input id="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit">دخول</button>
    </form>
    <section id="desk" hidden>
      <div class="bar">
        <h2 id="form-title">نظارة جديدة</h2>
        <button type="button" id="logout">خروج</button>
      </div>
      <form id="editor" class="card grid">
        <label>الصورة<input id="image" type="file" accept="image/*"></label>
        <label>الماركة<input name="brand" required placeholder="Muslem"></label>
        <label>اسم الموديل<input name="name" required></label>
        <label>السعر الأصلي<input name="old_price" inputmode="numeric" required></label>
        <label>سعر الخصم<input name="price" inputmode="numeric" required></label>
        <label>القسم
          <select name="audience">
            <option value="رجالي">رجالي</option>
            <option value="حريمي">حريمي</option>
            <option value="أطفال">أطفال</option>
            <option value="للجميع">للجميع</option>
          </select>
        </label>
        <label>النوع
          <select name="kind">
            <option value="شمسية">نظارات شمسية</option>
            <option value="طبية">نظارات طبية</option>
            <option value="قراءة">نظارات قراءة</option>
          </select>
        </label>
        <label>الشكل
          <select name="category" id="category"></select>
        </label>
        <label>الشارة
          <select name="badge">
            <option value="">بدون</option>
            <option value="bestseller">BESTSELLER</option>
            <option value="sale">خصم</option>
          </select>
        </label>
        <label>المخزون<input name="stock" inputmode="numeric" value="8"></label>
        <input type="hidden" name="id" id="product-id">
        <p id="form-error" class="error" hidden></p>
        <div class="actions">
          <button type="submit">حفظ</button>
          <button type="button" id="reset" class="ghost">جديد</button>
        </div>
      </form>
      <div id="list" class="list"></div>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
